security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                success_handler: App\Security\LoginSuccessHandler  # ← this routes by role
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                always_remember_me: true

    access_control:
        - { path: ^/login,      roles: PUBLIC_ACCESS }
        - { path: ^/company,    roles: ROLE_COMPANY  }
        - { path: ^/employee,   roles: ROLE_EMPLOYEE }
        - { path: ^/normaluser, roles: ROLE_USER     }
        - { path: ^/clients,    roles: ROLE_USER     }
        - { path: ^/sales,      roles: ROLE_USER     }
        - { path: ^/services,   roles: ROLE_USER     }
        - { path: ^/stock,      roles: ROLE_USER     }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        firewalls:
            main:
                form_login:
                    login_path: app_login
                    check_path: app_login
                    success_handler: App\Security\LoginSuccessHandler